name: calculator

services:
  calculator:
    image: ${IMAGE_NAME:-calculator}:${IMAGE_TAG:-latest}
    build: .
    environment:
      SERVER_PORT: "8080"
      JAVA_OPTS: "-Xms128m -Xmx256m"
    # Not published to the host; all traffic goes through the Nginx proxy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - calc-net

  proxy:
    image: calculator-proxy:${IMAGE_TAG:-latest}
    build: ./nginx
    ports:
      - "${PROXY_PORT:-8081}:80"
    depends_on:
      calculator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - calc-net

networks:
  calc-net:
    driver: bridge
