server {
    listen 80;

    # Docker's embedded DNS. Resolving per request (via the variable below) means a
    # redeploy that recreates the calculator container with a new IP does not break the proxy.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $calculator_upstream http://calculator:8080;

    location / {
        proxy_pass $calculator_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health of the proxy itself, independent of the backend
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
